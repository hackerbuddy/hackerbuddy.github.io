# Site settings
title: ArmorKeeper
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Security blog and toolkit documentation
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.armorkeeper.com" # the base hostname & protocol for your site
twitter_username: jekyllrb
github_username:  hackerbuddy

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Minima theme settings
minima:
  skin: dark
  social_links:
    github: hackerbuddy
    twitter: jekyllrb

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "ArmorKeeper"
      categories: []
      tags: []