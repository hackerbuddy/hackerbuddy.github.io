# Site settings
title: ArmorKeeper
tagline: Security Services & Advisory
description: >-
  ArmorKeeper provides offensive security services, vulnerability research,
  and security advisory for organizations that take their attack surface seriously.
baseurl: ""
url: "https://www.armorkeeper.com"
github_username: hackerbuddy

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Include dotfiles/dotfolders
include:
  - .well-known

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - LICENSE-CONTENT.md
  - README.md
  - node_modules
  - vendor/

# Minima theme settings
minima:
  skin: dark
  social_links:
    github: hackerbuddy

# Permalink structure for posts
permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "ArmorKeeper"

# Sass
sass:
  quiet_deps: true
  style: compressed
